services:
  gateway:
    image: ghcr.io/kianyari/to-dolist-gateway:latest
    container_name: gateway
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    ports:
      - 8000:8080
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_healthy
  user:
    image: ghcr.io/kianyari/to-dolist-user_service:latest
    container_name: user
    build:
      context: .
      dockerfile: ./user/Dockerfile
    ports:
      - 50051:50051
    env_file:
      - ./user/config/.env
    restart: unless-stopped

  task:
    image: ghcr.io/kianyari/to-dolist-task_service:latest
    container_name: task
    build:
      context: .
      dockerfile: ./task/Dockerfile
    ports:
      - 50052:50052
    env_file:
      - ./task/config/.env
    restart: unless-stopped
    depends_on:
      task-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification:
    image: ghcr.io/kianyari/to-dolist-notification_service:latest
    container_name: notification
    build:
      context: .
      dockerfile: ./notification/Dockerfile
    ports:
      - 50053:50053
    env_file:
      - ./notification/config/.env
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy

  user-db:
    container_name: user-db
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${USERDB_PORT}:5432
    volumes:
      - ./db_data/user:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  task-db:
    container_name: task-db
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${TASKDB_PORT}:5432
    volumes:
      - ./db_data/task:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - ${RABBITMQ_PORT}:5672
      - 15672:15672
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
