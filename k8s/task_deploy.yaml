apiVersion: apps/v1
kind: Deployment
metadata:
  name: task
  labels:
    app: task
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task
  template:
    metadata:
      labels:
        app: task
    spec:
      imagePullSecrets:
        - name: github-registry
      containers:
        - name: task
          image: ghcr.io/kianyari/to-dolist-task_service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50052
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: guest
            - name: RABBITMQ_PASSWORD
              value: guest
---
apiVersion: v1
kind: Service
metadata:
  name: task
  labels:
    app: task
spec:
  selector:
    app: task
  ports:
    - protocol: TCP
      port: 50052
      targetPort: 50052
  type: ClusterIP
